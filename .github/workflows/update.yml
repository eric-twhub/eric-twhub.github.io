name: 每日更新票價

on:
  schedule:
    # 對齊 ATPCO 公布票價的三個時段（台灣時間 09:30 / 23:30 / 02:00）
    - cron: '30 1 * * *'    # 台灣 09:30
    - cron: '30 15 * * *'   # 台灣 23:30
    - cron: '0 18 * * *'    # 台灣 02:00（隔日）
  workflow_dispatch:        # 也可以在 Actions 頁面手動觸發

permissions:
  contents: write

concurrency:
  group: update-fares
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取票價
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python3 scan_all.py

      - name: 檢查資料完整性
        run: |
          if [ ! -f /tmp/scan_all.json ]; then
            echo "::error::scan_all.json 不存在，抓取失敗"; exit 1
          fi
          N=$(python3 -c "import json;print(len(json.load(open('/tmp/scan_all.json'))))")
          echo "取得 $N 筆票價"
          if [ "$N" -lt 100 ]; then
            echo "::error::只取得 $N 筆（低於 100 筆門檻），可能是 API 異常，中止以免用壞資料覆蓋網站"
            exit 1
          fi

      - name: 更新日圓匯率
        run: python3 update_rate.py

      - name: 重新產生網站
        run: python3 gen.py

      - name: 產生社群分享縮圖（og:image）
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          fc-cache -f >/dev/null 2>&1 || true
          python3 make_og_cards.py
          # 中文沒算進去會整片豆腐字，用檔案大小粗略檢查有沒有算繪內容
          for f in og/*.png; do
            sz=$(wc -c < "$f")
            if [ "$sz" -lt 12000 ]; then
              echo "::error::$f 只有 ${sz} bytes，可能是字型缺失導致空白"; exit 1
            fi
          done
          echo "  og 圖卡共 $(ls og/*.png | wc -l) 張，合計 $(du -sh og | cut -f1)"
          # gen.py 是看磁碟上有沒有圖來決定 og:image 指向哪張，而它跑在產圖之前，
          # 所以新頁的第一輪會指到預設卡。再跑一次就正確了，gen.py 只要一兩秒。
          python3 gen.py

      - name: 產生圖卡
        # 月曆卡只在早班產出。圖卡會進版控以取得固定網址，每天一次即可，
        # 跑滿三班會讓 git 歷史多出三倍的二進位檔。
        run: |
          H=$(TZ=Asia/Taipei date '+%H')
          DISPATCH=0
          # 用 if 而不是 a && b：步驟以 bash -e 執行，測試失敗時 && 會讓整步中止
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then DISPATCH=1; fi
          if [ "$H" != "09" ] && [ "$DISPATCH" != "1" ]; then
            echo "非早班（現在 $H 時），略過圖卡"; exit 0
          fi
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null
          fc-cache -f >/dev/null 2>&1 || true
          python3 make_calendar_cards.py
          # 持有成本卡的內容幾乎不隨每日票價變動，每天重產只會讓 git 多出
          # 六個二進位檔，改成要發文時手動觸發才重產。
          if [ "$DISPATCH" = "1" ]; then
            python3 make_cost_cards.py
            python3 make_card_cards.py
            python3 make_ipcard_cards.py
            python3 make_bag_cards.py
          fi
          # 中文若沒算進去會整片豆腐字，用檔案大小粗略檢查是否有算繪內容
          for f in cards/calendar/*.png cards/cost/*.png cards/card/*.png cards/ipcard/*.png cards/bag/*.png; do
            [ -e "$f" ] || continue
            sz=$(wc -c < "$f")
            echo "  $f  ${sz} bytes"
            if [ "$sz" -lt 20000 ]; then
              echo "::error::$f 只有 ${sz} bytes，可能是字型缺失導致空白"; exit 1
            fi
          done

      - name: 提交變更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "票價無變動，不建立 commit"
            exit 0
          fi
          N=$(python3 -c "import json;print(len(json.load(open('/tmp/scan_all.json'))))")
          git commit -m "自動更新票價（$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台北時間，${N} 筆）"

          # concurrency 只擋得住「兩個 CI 撞在一起」，擋不住有人在這一輪跑的
          # 期間從本機推了 commit。push 被打回就整輪掃描白跑，所以要重試。
          #
          # rebase 時 -X theirs 保留的是「正在重播的這個 commit」＝本輪產生的
          # 頁面。這些 HTML 都是從票價快取重新生成的，用比較新的那一份覆蓋是對的。
          # 但要注意：若對方改的是 gen.py，本輪的 HTML 是用舊版 gen.py 產的，
          # 要等下一輪排程才會套用新版，這是刻意的取捨，總比整輪丟掉好。
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push 被打回（第 $i 次），與遠端整合後重試"
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "::error::rebase 失敗，本輪票價未推送"
              exit 1
            fi
          done
          echo "::error::重試三次仍無法推送"
          exit 1
