name: 每日更新票價

on:
  schedule:
    # 分鐘數刻意避開整點與半點。GitHub 的排程是 best effort，整點與半點是
    # 全平台最壅塞的時刻。
    #
    # 2026-10-19 查到：2026-10-11 起三班全部被延後 2 到 7 小時，在那之前
    # 只慢 4 到 21 分鐘。三班每天都有觸發也都成功，所以不是「有一班不跑」。
    # 排隊時間一律 0 分鐘，run 一建立就執行，可見是 GitHub 延後觸發本身，
    # 不是等機器。update.yml 在 9/30 到 10/13 之間沒改過，不是我們動到的。
    #
    # 延遲把第二三班擠到只差兩小時，然後空出十小時，實質上一天只掃兩次。
    # 改成冷門分鐘試看看，沒用的話至少排除掉這個變因。
    #
    # 原本的註解寫「對齊 ATPCO 公布票價的三個時段」，延遲之後那句已經
    # 不成立，所以拿掉，不要留著一個看起來有依據其實沒有的理由。
    - cron: '7 1 * * *'     # 台灣 09:07
    - cron: '23 15 * * *'   # 台灣 23:23
    - cron: '47 17 * * *'   # 台灣 01:47（隔日）
  workflow_dispatch:        # 也可以在 Actions 頁面手動觸發

permissions:
  contents: write

concurrency:
  group: update-fares
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取票價
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        run: python3 scan_all.py

      - name: 檢查資料完整性
        run: |
          if [ ! -f /tmp/scan_all.json ]; then
            echo "::error::scan_all.json 不存在，抓取失敗"; exit 1
          fi
          N=$(python3 -c "import json;print(len(json.load(open('/tmp/scan_all.json'))))")
          echo "取得 $N 筆票價"
          if [ "$N" -lt 100 ]; then
            echo "::error::只取得 $N 筆（低於 100 筆門檻），可能是 API 異常，中止以免用壞資料覆蓋網站"
            exit 1
          fi

      - name: 抓取逐月票價（月曆用）
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
        # 這是補充資料，抓不到就沿用上一版（gen.py 會回退到 repo 裡的
        # fares-monthly.json），不該因為它失敗就讓整個票價更新停掉。
        continue-on-error: true
        run: python3 scan_months.py

      - name: 抓取虎航官網票價
        # 票價資料庫收的是 OTA 報價，虎航主要自己賣，OTA 拿到的是加價後的票，
        # 比對下來官網便宜中位數 24%。抓不到就沿用 repo 裡上一版，gen.py 會
        # 印出警告；不該因為它失敗就讓整個票價更新停掉。
        continue-on-error: true
        run: python3 scan_tigerair.py

      - name: 比對登錄日期
        # reg_events 的日期是人工填的，填錯不會報錯，登錄日曆照樣算得出一個
        # 看起來合理的日期，讀者就會在錯的那天去登錄。2026-10-18 踩過一次。
        # 這支抓不到官網時只警告，只有真的對不起來才讓這輪停掉，
        # 所以不加 continue-on-error：那會讓真正的錯誤也被吞掉。
        run: python3 check_reg_dates.py

      - name: 更新日圓匯率
        run: python3 update_rate.py

      - name: 重新產生網站
        run: python3 gen.py

      - name: 產生社群分享縮圖（og:image）
        # 2026-10-22 這一步卡了 26 分 48 秒、一行輸出都沒有，吃掉整個 job 的
        # 30 分鐘額度被砍掉。正常只要 17 秒，卡住的是 apt 抓套件那段（-qq 是
        # 靜默的，所以「完全沒輸出」就代表還沒跑到我們自己的程式）。
        timeout-minutes: 6
        run: |
          # 字型本來就在 runner 上就不要碰網路。裝不成也往下走：底下的檔案
          # 大小檢查會抓到豆腐字，那比在這裡卡死 27 分鐘好判斷。
          if fc-list 2>/dev/null | grep -qi "Noto Sans CJK"; then
            echo "  已有 Noto Sans CJK，略過安裝"
          else
            APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
            timeout 120 sudo apt-get update -qq $APT \
              || echo "::warning::apt-get update 逾時或失敗，繼續往下走"
            timeout 180 sudo apt-get install -y -qq $APT fonts-noto-cjk >/dev/null \
              || echo "::warning::字型安裝逾時或失敗，下面的大小檢查會抓到"
          fi
          fc-cache -f >/dev/null 2>&1 || true
          python3 make_og_cards.py
          # 中文沒算進去會整片豆腐字，用檔案大小粗略檢查有沒有算繪內容
          for f in og/*.png; do
            sz=$(wc -c < "$f")
            if [ "$sz" -lt 12000 ]; then
              echo "::error::$f 只有 ${sz} bytes，可能是字型缺失導致空白"; exit 1
            fi
          done
          echo "  og 圖卡共 $(ls og/*.png | wc -l) 張，合計 $(du -sh og | cut -f1)"
          # gen.py 是看磁碟上有沒有圖來決定 og:image 指向哪張，而它跑在產圖之前，
          # 所以新頁的第一輪會指到預設卡。再跑一次就正確了，gen.py 只要一兩秒。
          python3 gen.py

      - name: 產生圖卡
        # 月曆卡只在早班產出。圖卡會進版控以取得固定網址，每天一次即可，
        # 跑滿三班會讓 git 歷史多出三倍的二進位檔。
        #
        # 2026-10-24 這一步卡了 22 分鐘、一行輸出都沒有，吃掉整個 job 的
        # 30 分鐘額度被砍。和 og:image 那次同一個病：卡在 apt 抓字型。
        # 給它自己的上限，不要再拖垮整個 job。
        timeout-minutes: 12
        run: |
          H=$(TZ=Asia/Taipei date '+%H')
          DISPATCH=0
          # 用 if 而不是 a && b：步驟以 bash -e 執行，測試失敗時 && 會讓整步中止
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then DISPATCH=1; fi
          if [ "$H" != "09" ] && [ "$DISPATCH" != "1" ]; then
            echo "非早班（現在 $H 時），略過圖卡"; exit 0
          fi
          # 字型已在 runner 上就不要碰網路。裝不成也往下走：底下的檔案大小
          # 檢查會抓到豆腐字，那比在這裡卡死好判斷。
          if fc-list 2>/dev/null | grep -qi "Noto Sans CJK"; then
            echo "  已有 Noto Sans CJK，略過安裝"
          else
            APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
            timeout 120 sudo apt-get update -qq $APT \
              || echo "::warning::apt-get update 逾時或失敗，繼續往下走"
            timeout 180 sudo apt-get install -y -qq $APT fonts-noto-cjk >/dev/null \
              || echo "::warning::字型安裝逾時或失敗，下面的大小檢查會抓到"
          fi
          fc-cache -f >/dev/null 2>&1 || true
          python3 make_calendar_cards.py
          # 持有成本卡的內容幾乎不隨每日票價變動，每天重產只會讓 git 多出
          # 六個二進位檔，改成要發文時手動觸發才重產。
          if [ "$DISPATCH" = "1" ]; then
            python3 make_cost_cards.py
            python3 make_card_cards.py
            python3 make_ipcard_cards.py
            python3 make_bag_cards.py
            # 這兩組原本只在本機產過，CI 沒跑，所以改了文案也不會更新。
            python3 make_oneway_cards.py
            python3 make_sapporo_cards.py
          fi
          # 中文若沒算進去會整片豆腐字，用檔案大小粗略檢查是否有算繪內容
          for f in cards/calendar/*.png cards/cost/*.png cards/card/*.png cards/ipcard/*.png cards/bag/*.png cards/oneway/*.png cards/sapporo/*.png; do
            [ -e "$f" ] || continue
            sz=$(wc -c < "$f")
            echo "  $f  ${sz} bytes"
            if [ "$sz" -lt 20000 ]; then
              echo "::error::$f 只有 ${sz} bytes，可能是字型缺失導致空白"; exit 1
            fi
          done

      - name: 提交變更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "票價無變動，不建立 commit"
            exit 0
          fi
          # gen.py 會把頁面實際用到的筆數（濾掉不在 DEST 的目的地並去重之後）
          # 寫到 /tmp/fare_count.txt。用它才會和頁面上「共 N 筆票價」對得起來。
          # 讀不到就退回 scan_all.json 的原始筆數，不要讓 commit 整個失敗。
          if [ -s /tmp/fare_count.txt ]; then
            N=$(cat /tmp/fare_count.txt)
          else
            N=$(python3 -c "import json;print(len(json.load(open('/tmp/scan_all.json'))))")
            echo "::warning::讀不到 /tmp/fare_count.txt，commit 訊息改用原始筆數"
          fi
          git commit -m "自動更新票價（$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台北時間，${N} 筆）"

          # concurrency 只擋得住「兩個 CI 撞在一起」，擋不住有人在這一輪跑的
          # 期間從本機推了 commit。push 被打回就整輪掃描白跑，所以要重試。
          #
          # rebase 時 -X theirs 保留的是「正在重播的這個 commit」＝本輪產生的
          # 頁面。這些 HTML 都是從票價快取重新生成的，用比較新的那一份覆蓋是對的。
          # 但要注意：若對方改的是 gen.py，本輪的 HTML 是用舊版 gen.py 產的，
          # 要等下一輪排程才會套用新版，這是刻意的取捨，總比整輪丟掉好。
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push 被打回（第 $i 次），與遠端整合後重試"
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "::error::rebase 失敗，本輪票價未推送"
              exit 1
            fi
          done
          echo "::error::重試三次仍無法推送"
          exit 1
