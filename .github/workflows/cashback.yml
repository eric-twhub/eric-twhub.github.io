name: 更新返利回饋率

# /japan-cashback/ 的「現在加碼」在瀏覽器端讀 /cashback.json 重畫，
# 所以這裡只更新資料檔，不跑 gen.py（gen.py 要整輪票價資料，單獨跑會產出零票價的全站）。
# 加碼常常只有幾個小時，比每日票價那三班更密。GitHub 排程會延遲，
# 分鐘數避開整點與半點；實際觸發時間以 Actions 頁面為準。
on:
  schedule:
    - cron: '13 16 * * *'   # 台灣 00:13（很多加碼 00:00 開始）
    - cron: '41 1 * * *'    # 台灣 09:41
    - cron: '17 4 * * *'    # 台灣 12:17（中午場）
    - cron: '43 7 * * *'    # 台灣 15:43
    - cron: '11 10 * * *'   # 台灣 18:11（晚上場常從 18:00 開始）
    - cron: '37 12 * * *'   # 台灣 20:37
  workflow_dispatch:

permissions:
  contents: write

# 和每日票價共用同一組，兩邊不會同時推
concurrency:
  group: update-fares
  cancel-in-progress: false

jobs:
  cashback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 抓取回饋率
        run: python3 scan_cashback.py
      - name: 提交變更
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cashback.json cashback-log.json
          if git diff --cached --quiet; then
            echo "回饋率沒變"
            exit 0
          fi
          git commit -m "自動更新返利回饋率（$(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M') 台北時間）"
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; exit 1; }
          done
          exit 1
